<mat-toolbar class="bar">
  <span class="brand">RutaU</span>
  @if (auth.isAuthenticated()) {
    <nav class="nav">
      @if (auth.isAdmin()) {
        <a mat-button routerLink="/admin/reportes" routerLinkActive="on">Reportes</a>
      }
      @if (auth.isUser()) {
        <a mat-button routerLink="/viajes" routerLinkActive="on">Buscar viajes</a>
        <a mat-button routerLink="/conductor/publicar" routerLinkActive="on">Publicar viaje</a>
        <a mat-button routerLink="/conductor/vehiculo" routerLinkActive="on">Mi vehículo</a>
      }
    </nav>
    <span class="sp"></span>
    <span class="who">{{ auth.user()?.fullName  }} · {{ roleLabel() }}</span>
    <button mat-icon-button (click)="logout()" aria-label="Salir"><mat-icon>logout</mat-icon></button>
  }
</mat-toolbar>
<main class="content"><router-outlet /></main>
